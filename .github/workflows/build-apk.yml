name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev libltdl-dev

      - name: Install buildozer
        run: |
          pip install --upgrade "pip==24.0" setuptools==68 cython buildozer
          pip --version

      - name: Setup SDK tools
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
          if [ ! -f ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp
            mv /tmp/cmdline-tools/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/ 2>/dev/null || cp -r /tmp/cmdline-tools/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/ || true
          fi
          ln -sf ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager 2>/dev/null || true
          chmod +x ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager 2>/dev/null || true
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license || true
          yes | sdkmanager --licenses 2>/dev/null || true
          for SM in $(find ~ -name sdkmanager -type f 2>/dev/null); do echo "accept $SM"; yes | $SM --licenses 2>/dev/null || true; done

      - name: Build APK
        run: |
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license || true
          # primer intento clona p4a (fallara en pip pero deja el codigo)
          buildozer --accept-sdk-license -v android debug || true
          # parchea p4a para pip 25+
          find ~/.buildozer -name "build.py" -type f 2>/dev/null | xargs -I {} sed -i "s/pip install -U pip/pip install pip==24.0/" {} 2>/dev/null || true
          for SM in $(find ~ -name sdkmanager -type f 2>/dev/null); do echo "accept $SM"; yes | $SM --licenses 2>/dev/null || true; done
          yes | sdkmanager --licenses 2>/dev/null || true
          buildozer --accept-sdk-license -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dino-runner-apk
          path: bin/*.apk
